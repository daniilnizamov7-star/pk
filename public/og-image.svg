<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2F0EB"/>
      <stop offset="100%" style="stop-color:#E8E5DE"/>
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Акцентная полоса -->
  <rect x="0" y="0" width="1200" height="8" fill="#0F52BA"/>
  
  <!-- Логотип / Название -->
  <text x="60" y="180" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#141210" letter-spacing="-2">
    BYTELAB
  </text>
  
  <!-- Подзаголовок -->
  <text x="60" y="260" font-family="Arial, sans-serif" font-size="36" fill="#5C5850">
    Сборка ПК в Челябинске
  </text>
  
  <!-- Описание -->
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="28" fill="#9C9888">
    Игровые · Рабочие · Студийные
  </text>
  <text x="60" y="380" font-family="Arial, sans-serif" font-size="28" fill="#9C9888">
    Гарантия 1 год · От 63 000 ₽
  </text>
  
  <!-- Декоративный элемент (квадрат) -->
  <rect x="900" y="180" width="240" height="240" fill="#0F52BA" opacity="0.1" rx="20"/>
  <rect x="920" y="200" width="200" height="200" fill="none" stroke="#0F52BA" stroke-width="3" rx="15"/>
  
  <!-- Иконка ПК (схематично) -->
  <rect x="970" y="240" width="100" height="120" fill="none" stroke="#0F52BA" stroke-width="4" rx="4"/>
  <line x1="990" y1="260" x2="1050" y2="260" stroke="#0F52BA" stroke-width="3"/>
  <line x1="990" y1="280" x2="1050" y2="280" stroke="#0F52BA" stroke-width="3"/>
  <line x1="990" y1="300" x2="1050" y2="300" stroke="#0F52BA" stroke-width="3"/>
  <circle cx="1080" cy="330" r="15" fill="#0F52BA"/>
</svg>
